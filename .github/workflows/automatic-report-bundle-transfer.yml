name: Temporary automatic owner PDF bundle materialization
on:
  push:
    branches:
      - ops/automatic-report-bundle-transfer-20261114
    paths:
      - '.github/workflows/automatic-report-bundle-transfer.yml'
      - 'src/lib/**'
      - 'scripts/build-automatic-report.mjs'
permissions:
  contents: write
jobs:
  build-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-automatic-report.mjs
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const code=fs.readFileSync('supabase/functions/automatic-report-email/report-bundle.js','utf8');
          const required=['REPORT_DRIVER_APPENDIX_MISSING','REPORT_NETWORK_APPENDIX_MISSING','Driver sales trend','driver_sales_entries','Network Management'];
          for(const marker of required)if(!code.includes(marker))throw new Error('BUNDLE_MISSING_'+marker);
          console.log('Validated driver and network markers', Buffer.byteLength(code));
          NODE
      - name: Save exactly tested bundle for connected deployment handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f supabase/functions/automatic-report-email/report-bundle.js
          git commit -m "build: materialize audited email PDF bundle (temporary branch)"
          git push origin HEAD:ops/automatic-report-bundle-transfer-20261114
