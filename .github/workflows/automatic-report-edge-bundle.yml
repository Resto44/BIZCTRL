name: Verify and package automatic email PDF edge bundle
on:
  pull_request:
    paths:
      - 'src/lib/automaticReportPdf.js'
      - 'supabase/functions/automatic-report-email/handler.ts'
      - 'scripts/pack-automatic-report-edge.mjs'
      - '.github/workflows/automatic-report-edge-bundle.yml'
permissions:
  contents: write
jobs:
  package:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/automatic-pdf-network-appendix-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build audited Edge PDF renderer
        run: |
          node scripts/build-automatic-report.mjs
          node scripts/pack-automatic-report-edge.mjs
      - name: Export source-verified, checksummed chunks to isolated temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c temp/automatic-report-email-bundle-20261108
          git add -f tmp/automatic-email-edge-build/
          git commit -m "build: nonproduction automatic report bundle for audited Supabase deploy [skip ci]"
          git push origin HEAD:refs/heads/temp/automatic-report-email-bundle-20261108
