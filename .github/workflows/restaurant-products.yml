name: Restaurant products validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'supabase/**'
      - 'package*.json'
      - '.github/workflows/restaurant-products.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: node scripts/audit-i18n-coverage.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: language-coverage-audit
          path: reports/i18n-coverage-audit.json
      - run: pnpm run build
