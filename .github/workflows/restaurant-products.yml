name: Restaurant products validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'supabase/**'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
      - 'scripts/check-portal-startup-bundle.mjs'
      - '.github/workflows/restaurant-products.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: node scripts/render-complete-analytics-fixtures.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bizctrl-erp-pdf-typography-preview
          path: tmp/pdfs/complete-*.pdf
          retention-days: 7
      - run: node scripts/audit-i18n-coverage.mjs
      - run: node scripts/audit-runtime-translation-gaps.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: erp-ar-fa-runtime-gaps
          path: reports/erp-runtime-translation-gaps.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: language-coverage-audit
          path: reports/i18n-coverage-audit.json
      - run: pnpm run build
      - run: node scripts/build-automatic-report.mjs
      # Keep the separately deployed Supabase email worker in lock-step with
      # the Owner PDF. The packer refuses any bundle without Driver/Network
      # section renderers, source data, and required failure guards.
      - run: node scripts/pack-automatic-report-edge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bizctrl-automatic-email-pdf-bundle
          path: supabase/functions/automatic-report-email/report-bundle.js
          retention-days: 7
      - run: node scripts/check-portal-startup-bundle.mjs
